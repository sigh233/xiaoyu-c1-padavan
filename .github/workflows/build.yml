name: 小娱C1 Padavan 老毛子固件编译

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      padavan_version:
        description: 'Padavan 源分支'
        required: true
        default: 'main'
        type: string

env:
  REPO_URL: https://github.com/hanwckf/padavan-4.4.git
  DEVICE: XY-C1
  TEMPLATE: configs/templates/XY-C1.config

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    # 关键：显式声明写权限，否则 GITHUB_TOKEN 默认只读，发布 Release 会 403
    permissions:
      contents: write

    steps:
      - name: 检查源码
        uses: actions/checkout@v4

      - name: 下载 Padavan 完整源码
        run: |
          git clone --depth 1 $REPO_URL padavan_src
          cd padavan_src
          git submodule update --init --recursive || true

      - name: 准备工具链
        run: |
          cd padavan_src
          ls -la toolchain-mipsel/
          cd toolchain-mipsel
          chmod +x dl_toolchain.sh
          # 从 GitHub Releases 下载预编译工具链 (x86_64 host)
          ./dl_toolchain.sh
          ls -la toolchain-4.4.x/

      - name: 修复 e2fsprogs configure 宏 (gettext 不兼容)
        run: |
          cd padavan_src/trunk/user/e2fsprogs
          # 新版 gettext/m4 要求宏参数用方括号: AM_GNU_GETTEXT([external])
          sed -i 's/AS_GNU_GETTEXT(external)/AS_GNU_GETTEXT([external])/g' configure
          # 确认修复是否生效
          grep -n "AM_GNU_GETTEXT" configure | head -3

      - name: 复制设备配置 (可在此修改具体选项)
        run: |
          cd padavan_src/trunk
          cp $TEMPLATE $TEMPLATE.bak
          echo "使用模板: $TEMPLATE"
          # 硬件加速(SFE) 已在模板中默认开启: CONFIG_FIRMWARE_INCLUDE_SFE=y
          # 如需关闭其他功能以节省体积，可取消下面注释并改为实际配置值
          # sed -i 's/#CONFIG_FIRMWARE_INCLUDE_UVC=y/CONFIG_FIRMWARE_INCLUDE_UVC=n/' $TEMPLATE

      - name: 添加系统优化
        run: |
          cd padavan_src/trunk
          # 添加 BBR 拥塞控制
          echo "net.core.default_qdisc=fq" >> /etc/sysctl.d/10-bbr.conf 2>/dev/null || true
          echo "net.ipv4.tcp_congestion_control=bbr" >> /etc/sysctl.d/10-bbr.conf 2>/dev/null || true
          echo "系统优化配置添加完成"

      - name: 开始编译 firmware
        run: |
          cd padavan_src/trunk
          fakeroot ./build_firmware_modify $DEVICE 2>&1 | tee build.log
          echo "编译输出:"
          ls -la images/

      - name: 验证编译产物
        run: |
          cd padavan_src/trunk
          if [ -z "$(find images -name '*.trx' -type f 2>/dev/null)" ] && [ -z "$(find images -name '*.bin' -type f 2>/dev/null)" ]; then
            echo "错误: 固件文件未生成"
            ls -la images/
            tail -20 build.log
            exit 1
          fi
          echo "产物已生成:"
          ls -lh images/

      - name: 整理固件文件
        run: |
          cd padavan_src/trunk
          mkdir -p $GITHUB_WORKSPACE/firmware
          cp images/*.trx $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          cp images/*.bin $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          cd $GITHUB_WORKSPACE/firmware
          ls -lh $GITHUB_WORKSPACE/firmware/

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}-padavan-firmware-v${{ github.run_number }}
          path: firmware/
          retention-days: 30

      - name: 发布新版本
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          # 关键：显式传 token。不传时 action 回退到 github.token，
          # 若仓库默认 workflow 权限为只读就会 403
          token: ${{ secrets.GH_PAT || github.token }}
          tag_name: ${{ env.DEVICE }}-padavan-${{ github.run_number }}
          name: 小娱C1 Padavan ${{ github.event.inputs.padavan_version || 'main' }} 版
          files: |
            firmware/*.trx
            firmware/*.bin
          body: |
            ## 小娱C1 Padavan 老毛子固件
            
            ### 硬件信息
            - 设备: XiaoYu XY-C1
            - CPU: MT7621A 双核 880MHz
            - Flash: 16MB / RAM: 128MB
            
            ### 软件版本
            - 固件: padavan-4.4
            - 内核: Linux 4.4.x
            
            ### 内置功能
            - 硬件加速 (SFE)
            - 多拨支持 (Multi-PPPoE)
            - IPv6 支持
            - FullCone NAT (P2P加速)
            - BBR 拥塞控制
