name: 小娱C1 Padavan :  寛子固件编译 (NAPT66)


on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      padavan_commit:
        description: 'Padavan 提交 (NAPT66 最后一个版本 80d1d82)'
        required: false
        default: '80d1d82fe61a39582e37b4d0050d474664ae10b2'
        type: string
      enable_extra_debug:
        description: '开启额外调试输出'
        required: false
        default: false
        type: boolean


env:
  REPO_URL: https://github.com/immortalwrt/padavan.git
  DEVICE: XY-C1
  TEMPLATE: configs/templates/XY-C1.config


jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    # 关键：显式声明写权限，否则 GITHUB_TOKEN 默认只读，发布 Release 会 403
    permissions:
      contents: write


    steps:
      - name: 检查源码
        uses: actions/checkout@v4


      - name: 下载 Padavan 指定提交
        run: |
          git clone --depth 1 $REPO_URL padavan_src
          cd padavan_src
          git fetch --depth 1 origin ${{ inputs.padavan_commit }} || true
          git checkout FETCH_HEAD || true
          git submodule update --init --recursive || true


      - name: 准备工具链 (3.4.x)
        run: |
          cd padavan_src
          ls -la toolchain-mipsel/
          cd toolchain-mipsel
          chmod +x dl_toolchain.sh
          # 从 GitHub Releases 下载预编译工具链 (x86_64 host)
          ./dl_toolchain.sh
          ls -la toolchain-3.4.x/


      - name: 复制设备配置
        run: |
          cd padavan_src/trunk
          cp $TEMPLATE $TEMPLATE.bak
          echo "使用模板: $TEMPLATE"
          # 硬件加速(SFE) 已在模板中默认开启: CONFIG_FIRMWARE_INCLUDE_SFE=y
          # 如需关闭其他功能以节省体积，可取消下面注释并改为实际配置值
          # sed -i 's/#CONFIG_FIRMWARE_INCLUDE_UVC=y/CONFIG_FIRMWARE_INCLUDE_UVC=n/' $TEMPLATE
          # 修复 e2fsprogs 的 gettext 宏：在 autoreconf 前把 configure.ac 里的
          # AM_GNU_GETTEXT(external) 改成 AM_GNU_GETTEXT([external])，否则
          # autoreconf 生成的 configure 会报 syntax error near unexpected token 'external'
          python3 - <<'PY'
          p = 'user/e2fsprogs/Makefile'
          s = open(p).read()
          old = 'autoreconf -fi ;'
          new = 'sed -i "s/AM_GNU_GETTEXT(external)/AM_GNU_GETTEXT([external])/g" configure.ac ; autoreconf -fi ;'
          if old in s:
              s = s.replace(old, new, 1)
              open(p, 'w').write(s)
              print("e2fsprogs Makefile patched")
          else:
              print("WARN: autoreconf pattern not found, skipped")
          PY


      - name: 添加系统优化
        run: |
          cd padavan_src/trunk
          # 添加 BBR 拥塞控制
          echo "net.core.default_qdisc=fq" >> /etc/sysctl.d/10-bbr.conf 2>/dev/null || true
          echo "net.ipv4.tcp_congestion_control=bbr" >> /etc/sysctl.d/10-bbr.conf 2>/dev/null || true
          echo "系统优化配置添加完成"


      - name: 安装构建工具 (gettext/autopoint/libtool/automake/toolchain)
        run: |
          sudo apt-get update -qq
          # 关键：必须安装 gettext (提供 autopoint)、autoconf、automake、libtool、pkg-config
          # 否则 mksquashfs_xz 的 xz-5.2.4 在 autogen.sh 中会报 "autopoint: not found"
          sudo apt-get install -y --no-install-recommends \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            m4 \
            build-essential
          echo "确认工具链:"
          which autopoint libtoolize automake autoconf
          ls -l $(which autopoint)


      - name: 开始编译 firmware
        run: |
          cd padavan_src/trunk
          fakeroot ./build_firmware_modify $DEVICE 2>&1 | tee build.log
          echo "编译输出:"
          ls -la images/


      - name: 验证编译产物
        run: |
          cd padavan_src/trunk
          if [ -z "$(find images -name '*.trx' -type f 2>/dev/null)" ] && [ -z "$(find images -name '*.bin' -type f 2>/dev/null)" ]; then
            echo "错误: 固件文件未生成"
            ls -la images/
            tail -50 build.log
            exit 1
          fi
          echo "产物已生成:"
          ls -lh images/


      - name: 整理固件文件
        run: |
          cd padavan_src/trunk
          mkdir -p $GITHUB_WORKSPACE/firmware
          cp images/*.trx $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          cp images/*.bin $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          cd $GITHUB_WORKSPACE/firmware
          ls -lh $GITHUB_WORKSPACE/firmware/


      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}-padavan-firmware-v${{ github.run_number }}
          path: firmware/
          retention-days: 30


      - name: 发布固件
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          # 关键：通过 GITHUB_TOKEN 的 acquire 动作，确保 Release 可以创建
          # debug: true
          token: ${{ secrets.GH_PA_TOKEN || github.token }}
          tag_name: ${{ env.DEVICE }}-padavan-${{ github.run_number }}
          name: 小娱C1 Padavan ${{ github.event.inputs.padavan_commit || '80d1d82' }}
          files: |
            firmware/*.trx
            firmware/*.bin
          body: |
            ### 小娱C1 Padavan 固件 (NAPT66)
            ### 详细信息
            - 设备: Xiaoyu XY-C1
            - CPU: MT7620A 880MHz
            - Flash: 16MB / RAM: 128MB

            ### 源版本
            - 修改自 immortalwrt/padavan (NAPT66 最后一个版本)
            - 内核: Linux 3.4.x

            ### 功能
            - 硬件加速 (SFE)
            - 波形 Nap (Multi-PPOE)
            - IPv6 支持
            - FullCone NAT (P2P加速)
            - NAPT66 (IPv6 NAT, WebUI中可开启)
            - BBR 拥塞控制

          draft: false
          prerelease: false